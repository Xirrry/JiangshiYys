<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>神秘商店</title><style>
:root{font-family:'Microsoft YaHei UI','Microsoft YaHei',sans-serif;color:#322c25;background:#f4f0e7;font-size:14px}*{box-sizing:border-box}body{margin:0}header{padding:29px 34px 23px;border-bottom:1px solid #ded4c5;background:#eee6d8;display:flex;align-items:center;justify-content:space-between;gap:20px}h1{font-family:KaiTi,serif;font-size:31px;margin:5px 0 8px;letter-spacing:3px}.eyebrow{font-size:11px;letter-spacing:4px;color:#92765e}.sub{color:#8b7d6e;font-size:12px}button,select,input{font:inherit;border:1px solid #d9cdbb;border-radius:7px;background:#fffcf7;color:#594634;padding:9px 12px}button{cursor:pointer}button.primary{background:#70533d;color:#fff;border-color:#70533d}button:disabled{opacity:.5;cursor:wait}main{padding:22px 34px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:16px}input{width:190px}.status{color:#887766;font-size:12px;min-height:23px}.role{margin:24px 0 9px;display:flex;justify-content:space-between;align-items:baseline}.role h2{font-size:18px;margin:0}.role span{color:#948471;font-size:12px}.shop{margin:12px 0 22px;border:1px solid #dbcfbe;border-radius:12px;overflow:hidden;background:#fcf9f2}.shop-head{display:flex;align-items:center;gap:12px;padding:13px 17px;background:#eae1d3;color:#6f5540}.shop-head strong{font-size:14px}.shop-head small{color:#91775e}.goods{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:#e9e0d2}.good{position:relative;padding:20px 17px 16px;background:#fffcf6;min-height:163px;overflow:hidden}.good.sold{background:#f0ece5}.good.locked{background:#f7f1ec}.name{font-weight:600;margin:0 0 4px;font-size:16px;min-height:23px;padding-right:46px}.qty{font-size:11px;color:#9a8d7c}.flower{position:absolute;right:12px;top:17px;color:#b47c80;letter-spacing:0;font-size:19px}.flower small{font-family:inherit;font-size:11px;color:#9b7a79;display:block;text-align:right;letter-spacing:0}.price{font-size:22px;color:#754829;font-weight:600;margin-top:18px}.price small{font-size:12px;font-weight:400;margin-left:5px}.bottom{display:flex;justify-content:space-between;gap:8px;margin-top:11px;color:#9b8d7e;font-size:11px}.tag{font-size:10px;border-radius:4px;padding:2px 5px;background:#efdecc;color:#9d5b3a}.availability{color:#5e7761}.sold .availability{color:#998d80}.locked .availability{color:#b77968}.empty{padding:70px 0;text-align:center;color:#958573}details{font-size:12px;color:#a56e53;margin-bottom:12px}summary{cursor:pointer}.hint{padding-top:15px;border-top:1px solid #ded4c5;color:#a0907d;font-size:11px;line-height:1.8}@media(max-width:1000px){.goods{grid-template-columns:repeat(3,minmax(0,1fr))}header,main{padding-left:22px;padding-right:22px}} 
.good.important{background:#fff7e5;box-shadow:inset 0 3px #ba8c48}.good.important.sold{background:#eee9df;box-shadow:inset 0 3px #b8aa94}.good.important.locked{background:#f6ece0}.priority-tag{color:#9a672a;font-size:11px;margin-right:8px}.toolbar label{white-space:nowrap}.view-bar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:18px 0 14px;flex-wrap:wrap}.view-switch{display:inline-flex;gap:4px;padding:4px;background:#e9e0d3;border:1px solid #ded0bc;border-radius:10px}.view-switch button{border:0;background:transparent;color:#8a755d;padding:8px 15px;border-radius:7px;font-size:12px}.view-switch button[aria-pressed=true]{background:#6b5140;color:#fff7ec;box-shadow:0 2px 6px #5c3a2220}.view-note{font-size:12px;color:#9b876d}.goods{grid-template-columns:repeat(auto-fill,minmax(235px,1fr))}.good{min-width:0}.item-context{display:flex;flex-direction:column;gap:4px;color:#725c43;font-size:12px;margin-bottom:17px;padding-bottom:10px;border-bottom:1px solid #b7a07d33;padding-right:30px}.item-context small{font-size:10px;color:#9c896e}.focus-group .shop-head{background:linear-gradient(100deg,#e7d6b9,#eee6d8);padding:16px 18px}.group-dot{width:9px;height:9px;background:#ac8043;border-radius:3px;transform:rotate(45deg)}body[data-view=focus] .good{border-top:0;box-shadow:none}body[data-view=focus] .flower{top:111px}body[data-view=focus] .name{padding-right:60px}body[data-view=focus] .shop{margin-top:18px}
body[data-view=list] .goods{display:block}body[data-view=list] .good{display:grid;grid-template-columns:minmax(150px,1.5fr) 90px minmax(120px,1fr) minmax(145px,1fr);column-gap:15px;row-gap:5px;min-height:83px;padding:15px 20px;border-bottom:1px solid #dfd1bc;box-shadow:none;border-left:3px solid transparent;align-items:center}body[data-view=list] .good.important{border-left-color:#b88b48}body[data-view=list] .good:last-child{border-bottom:0}body[data-view=list] .name{grid-column:1;grid-row:1;font-size:14px;margin:0;padding:0;min-height:0}body[data-view=list] .qty{grid-column:1;grid-row:2}body[data-view=list] .flower{position:static;grid-column:2;grid-row:1 / 3;font-size:15px}body[data-view=list] .flower small{text-align:left}body[data-view=list] .price{grid-column:3;grid-row:1 / 3;margin:0;font-size:19px}body[data-view=list] .bottom{grid-column:4;grid-row:1 / 3;margin:0;flex-direction:column;gap:7px}body[data-view=list] .shop-head{padding:10px 18px}body[data-view=list] .role{margin-top:18px}@media(max-width:850px){body[data-view=list] .good{grid-template-columns:minmax(120px,1.5fr) 65px 105px minmax(115px,1fr);column-gap:9px;padding:12px}.view-note{line-height:1.6}body[data-view=focus] .flower{top:111px}}

body[data-view=focus] #content{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px;align-items:start;margin:16px 0 24px}body[data-view=focus] .focus-group{margin:0}body[data-view=focus] .goods{display:flex;flex-direction:column}body[data-view=focus] .good{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;padding:16px 18px;min-height:200px}body[data-view=focus] .item-context{grid-column:1 / 3;margin:0 0 4px;padding:0 0 9px;gap:4px}body[data-view=focus] .name{grid-column:1;grid-row:2;padding:0;margin:0;font-size:15px}body[data-view=focus] .qty{grid-column:1;grid-row:3}body[data-view=focus] .flower{position:static;grid-column:2;grid-row:2 / 4;align-self:center;font-size:15px}body[data-view=focus] .price{grid-column:1 / 3;grid-row:4;margin:4px 0 0;font-size:22px}body[data-view=focus] .bottom{grid-column:1 / 3;grid-row:5;margin:2px 0 0}body[data-view=focus] .focus-group[data-group=black-shard] .shop-head,body[data-view=focus] .focus-group[data-group=black-egg] .shop-head{background:#dfd4c7}body[data-view=focus] .focus-group[data-group=blue-ticket] .shop-head{background:#dce4e4}body[data-view=focus] .focus-group[data-group=taiko] .shop-head{background:#e2e4d3}
</style><body class="workspace-document shop-document"><header class="workspace-header"><div><h1>神秘商店</h1><div class="sub">把值得留意的商品，放在一起看。</div></div><div class="workspace-actions"><button id="refresh-records">刷新记录</button><select id="window" aria-label="游戏窗口"><option value="all">所有运行窗口</option></select> <button id="refresh">刷新窗口</button> <button id="read" class="primary">读取全部窗口</button></div></header>
<main><div class="toolbar workspace-filters"><input id="search" placeholder="搜索商品名称"><select id="source"><option value="all">全部商店</option><option value="own" selected>自己的商店</option><option value="shared">好友分享</option></select><select id="flowers"><option value="all">全部羁绊</option><option value="0">不限羁绊</option><option value="1">1 花</option><option value="2">2 花</option><option value="3">3 花</option></select><select id="currency"><option value="all">全部币种</option><option value="900002">勾玉</option><option value="900001">金币</option><option value="900000">魂玉</option></select><select id="focus"><option value="all">全部重点类别</option><option value="black-shard">黑碎</option><option value="black-egg">黑蛋</option><option value="blue-ticket">蓝票</option><option value="demon-soul">逢魔之魂</option><option value="reverse-scale">大蛇的逆鳞</option><option value="taiko">太鼓结界卡</option></select><label><input id="important" type="checkbox" style="width:auto"> 仅看重点</label><label><input id="special" type="checkbox" style="width:auto"> 仅特惠</label><label><input id="available" type="checkbox" style="width:auto"> 仅可购买</label></div><div class="view-bar"><div class="view-switch workspace-view-switch" role="group" aria-label="商店视图"><button data-shop-view="cards" aria-pressed="true">▦ 卡片总览</button><button data-shop-view="list" aria-pressed="false">☷ 紧凑列表</button><button data-shop-view="focus" aria-pressed="false">◇ 重点汇总</button></div><span class="view-note" id="view-note"></span></div><div class="status workspace-status" id="status" role="status">读取游戏已加载的商店数据</div><details id="errors" hidden><summary></summary><div></div></details><div id="content"></div><div class="hint">重点道具优先排列：黑碎、黑蛋、蓝票、逢魔之魂、大蛇的逆鳞、太鼓结界卡。太鼓保留原有星级。<br>花朵表示商品要求的羁绊等级；可购买状态按本次游戏读取结果显示，不代表货币余额充足。<br>保留各角色上次成功读取的数据；打开游戏商店后可更新。此页面仅查看，不执行购买。</div></main>
<script>
let state={roles:{}}, busy=false,shopView='cards';
try{const saved=localStorage.getItem('mystery-shop-view');if(['cards','list','focus'].includes(saved))shopView=saved}catch{}
const $=id=>document.getElementById(id),escape=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const currency=id=>({900002:'勾玉',900001:'金币',900000:'魂玉'}[id]||'其他货币');
const priorities=[['black-shard','黑碎'],['black-egg','黑蛋'],['blue-ticket','蓝票'],['demon-soul','逢魔之魂'],['reverse-scale','大蛇的逆鳞'],['taiko','太鼓结界卡']];
function importantType(g){const name=String(g.name||'').replace(/（/g,'(').replace(/）/g,')');const id=Number(g.product);if(id===434111||name==='御行达摩(碎片)')return 'black-shard';if(name==='御行达摩')return 'black-egg';if(id===490001||name==='神秘的符咒')return 'blue-ticket';if(id===900218||name==='逢魔之魂')return 'demon-soul';if(id===900217||name==='大蛇的逆鳞')return 'reverse-scale';if(/^[一二三四五六1-6]星太鼓$/.test(name)||name==='太鼓')return 'taiko';return '';}
const priorityRank=g=>{const i=priorities.findIndex(p=>p[0]===importantType(g));return i<0?99:i};
const priorityLabel=g=>priorities.find(p=>p[0]===importantType(g))?.[1]||'';
function goodCard(g,data,shop,withContext=false){
 const expired=Date.now()/1000>=data.expires_at;
 return `<article class="good ${escape(g.status)} ${importantType(g)?'important':''}">
 ${withContext?`<div class="item-context">${escape(data.role.name)} <small>· ${escape(data.role.server)} · ${shop.own?'自有商店':'好友分享 '+shop.index} · Lv.${escape(shop.level??'—')}</small><small>${expired?'已过期':`有效至 ${new Date(data.expires_at*1000).toLocaleTimeString('zh-CN',{hour12:false})}`}</small></div>`:''}
 <div class="flower" title="${escape(({1:'友谊的见证',2:'温暖的陪伴',3:'永远的羁绊'})[g.flowers]||'不限羁绊')}">${'❀'.repeat(Math.min(3,Math.max(0,g.flowers)))}<small>${g.flowers?g.flowers+' 花':'不限羁绊'}</small></div>
 <div class="name">${escape(g.name)}</div><div class="qty">${importantType(g)?`<span class="priority-tag">◆ ${escape(priorityLabel(g))}</span>`:''}每份 × ${escape(g.quantity)}</div>
 <div class="price">${g.costs.map(c=>`${Number(c.amount).toLocaleString()}<small>${currency(c.currency)}</small>`).join(' + ')}</div>
 <div class="bottom"><span class="availability">${expired?'记录已过期':g.status==='sold'?'已售罄':g.status==='locked'?'羁绊不足':g.status==='available'?'剩余 '+(g.remaining??'—')+' 次':'状态待确认'}</span><span>${g.special?'<span class="tag">特惠</span> ':''}${g.rate===1?'':escape(Math.round(g.rate*100))+'% 原价'}</span></div></article>`;
}
function matchesGood(g,data){return (!$('search').value||g.name.includes($('search').value))&&($('flowers').value==='all'||String(g.flowers)===$('flowers').value)&&($('currency').value==='all'||g.costs.some(c=>String(c.currency)===$('currency').value))&&(!$('important').checked||importantType(g))&&($('focus').value==='all'||importantType(g)===$('focus').value)&&(!$('special').checked||g.special)&&(!$('available').checked||(g.status==='available'&&Date.now()/1000<data.expires_at))}
function render(){
 document.body.dataset.view=shopView;
 document.querySelectorAll('[data-shop-view]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.shopView===shopView)));
 $('view-note').textContent={cards:'按角色和店铺浏览，适合查看完整商品。',list:'压缩为逐行清单，一屏浏览更多商品。',focus:'跨角色归集六类重点道具，保留店铺来源、星级和羁绊要求。'}[shopView];
 let html='',count=0;const buckets=new Map(priorities.map(([key,label])=>[key,{label,cards:[]}]));
 for(const data of Object.values(state.roles||{})){
  let blocks='';
  for(const shop of data.shops||[]){
   if($('source').value==='own'&&!shop.own||$('source').value==='shared'&&shop.own)continue;
   const goods=shop.goods.filter(g=>matchesGood(g,data)&&(shopView!=='focus'||importantType(g))).sort((a,b)=>priorityRank(a)-priorityRank(b));
   if(!goods.length)continue;count+=goods.length;
   if(shopView==='focus'){for(const g of goods)buckets.get(importantType(g)).cards.push(goodCard(g,data,shop,true));continue}
   blocks+=`<section class="shop"><div class="shop-head"><strong>${shop.own?'自己的商店':'好友分享 '+shop.index}</strong><small>商人 Lv.${escape(shop.level??'—')} · ${goods.length} 件商品</small></div><div class="goods">${goods.map(g=>goodCard(g,data,shop)).join('')}</div></section>`;
  }
  if(blocks){const expired=Date.now()/1000>=data.expires_at;html+=`<div class="role"><h2>${escape(data.role.name)} <span>· ${escape(data.role.server)}</span></h2><span>${expired?'有效期已结束':`有效至 ${new Date(data.expires_at*1000).toLocaleString('zh-CN',{hour12:false})}`} · ${new Date(data.captured_at*1000).toLocaleTimeString('zh-CN',{hour12:false})} 读取</span></div>`+blocks}
 }
 if(shopView==='focus')for(const [key,bucket] of buckets){if(bucket.cards.length)html+=`<section class="shop focus-group" data-group="${key}"><div class="shop-head"><span class="group-dot"></span><strong>${escape(bucket.label)}</strong><small>${bucket.cards.length} 条商品记录</small></div><div class="goods">${bucket.cards.join('')}</div></section>`}
 $('content').innerHTML=html||'<div class="empty">'+(Object.keys(state.roles||{}).length?(shopView==='focus'?'当前筛选下没有六类重点道具，可切换卡片总览查看全部商品。':'没有符合筛选的商品'):'打开游戏中的神秘商店，再点击右上角读取按钮')+'</div>';
 if(!busy)$('status').textContent=`${Object.keys(state.roles||{}).length} 个角色存档 · 当前显示 ${count} 件商品`;
 const errors=state.errors||[];$('errors').hidden=!errors.length;$('errors').querySelector('summary').textContent=errors.length+' 个窗口未更新，展开查看';$('errors').querySelector('div').innerHTML=errors.map(e=>`<p>${escape(e.window)}：${escape(e.message)}</p>`).join('');
}
document.querySelectorAll('[data-shop-view]').forEach(button=>button.onclick=()=>{shopView=button.dataset.shopView;try{localStorage.setItem('mystery-shop-view',shopView)}catch{}render()});

for(const id of ['search','source','flowers','currency','focus','important','special','available'])$(id).addEventListener('input',render);
$('refresh-records').onclick=async()=>{if(busy)return;try{state=await pywebview.api.load();render()}catch(e){$('status').textContent=e.message}};
$('window').addEventListener('change',()=>{$('read').textContent=$('window').value==='all'?'读取全部窗口':'读取所选窗口'});
$('read').onclick=async()=>{busy=true;let failure='';$('read').disabled=true;$('refresh-records').disabled=true;$('read').textContent='正在读取…';$('refresh').disabled=true;$('window').disabled=true;$('status').textContent='正在逐个读取窗口，请稍候…';try{state=await pywebview.api.read($('window').value)}catch(e){failure=String(e.message||e)}finally{busy=false;$('read').disabled=false;$('refresh-records').disabled=false;$('read').textContent=$('window').value==='all'?'读取全部窗口':'读取所选窗口';$('refresh').disabled=false;$('window').disabled=false;render();if(!failure)$('status').textContent+=' · 本次成功 '+(state.successes||0)+' 个窗口，失败 '+(state.errors||[]).length+' 个窗口';if(failure)$('status').textContent=failure}};
async function refreshWindows(){const previous=$('window').value;const rows=await pywebview.api.windows();$('window').replaceChildren(new Option('所有运行窗口','all'));for(const w of rows){const option=new Option(w.title||'游戏窗口',w.id);$('window').append(option)}if(rows.some(w=>w.id===previous))$('window').value=previous;}
$('refresh').onclick=async()=>{if(busy)return;try{await refreshWindows()}catch(e){$('status').textContent=e.message||String(e)}};
async function init(){try{state=await pywebview.api.load();render();await refreshWindows()}catch(e){$('status').textContent=e.message||String(e)}}
if(window.pywebview?.api)init();else window.addEventListener('pywebviewready',init,{once:true});render();
</script></html>
