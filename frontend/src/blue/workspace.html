<script>
const BLUE_ICONS=__BLUE_ICONS__;
const names=[];
const records=new Map();
const localToday=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;};
const $=id=>document.getElementById(id);let view='week',calendarCharacter=0,selectedDate=localToday(),weekStart=monday(localToday()),weekPage=1,weekPageSize=6,page=1,editingNames=[],opener=null;let size=8;let weekSort=null;
const esc=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const kind=r=>r.mode||'daily';
const kindLabel=r=>kind(r)==='xiajian'?'狭间':'道馆';
const isComplete=r=>kind(r)==='xiajian'?[r.blue,r.fragments,r.eggs].every(v=>v!==null):r.first!==null&&r.second!==null;
const attemptState=(r,field)=>r[field+'State']??(r[field]==null?'pending':'recorded');
const isPending=r=>kind(r)==='xiajian'?!isComplete(r):['first','second'].some(f=>attemptState(r,f)==='pending');
const hasUnknown=r=>kind(r)==='daily'&&['first','second'].some(f=>attemptState(r,f)==='unknown');
function candidateNames(){return names.map((_,n)=>n);}
function attemptInput(r,n,field,label){const state=attemptState(r||{},field),numeric=state==='recorded';return `<div class="attempt-editor"><select name="${field}State-${n}" aria-label="${esc(names[n])}${label}状态"><option value="recorded" ${numeric?'selected':''}>数量</option><option value="pending" ${state==='pending'?'selected':''}>待补</option><option value="not_played" ${state==='not_played'?'selected':''}>未打</option><option value="unknown" ${state==='unknown'?'selected':''}>未知</option></select><input name="${field}-${n}" type="number" min="0" max="1000000" step="1" value="${r?.[field]??''}" aria-label="${esc(names[n])}${label}" placeholder="数量（含 0）"></div>`;}
function readAttempt(form,n,field){const raw=String(form.get(field+'-'+n)??'').trim();let state=String(form.get(field+'State-'+n)||'pending');if(state==='pending'&&raw)state='recorded';if(state!=='recorded')return {value:null,state};if(!raw)return {value:null,state:'pending'};const value=Number(raw);if(!Number.isSafeInteger(value)||value<0||value>1000000)throw Error('数量必须为 0–1000000 的整数');return {value,state};}
function syncAttemptInputs(){document.querySelectorAll('.attempt-editor').forEach(box=>{const select=box.querySelector('select'),input=box.querySelector('input');input.disabled=['not_played','unknown'].includes(select.value)||$('daily-editor').hidden;input.hidden=['not_played','unknown'].includes(select.value);select.disabled=$('daily-editor').hidden;select.onchange=()=>{if(select.value==='pending')input.value='';syncAttemptInputs();};input.oninput=()=>{if(input.value!=='')select.value='recorded';};});}
const hasBlue=r=>kind(r)==='xiajian'?r.blue!==null:r.first!==null||r.second!==null;
const total=r=>kind(r)==='xiajian'?(r.blue??0):(r.first??0)+(r.second??0);
const keyFor=(date,n,mode)=>`${date}/${n}${mode==='xiajian'?'/xiajian':''}`;
function allowsXiajian(date){const day=new Date(`${date}T00:00:00Z`).getUTCDay();return day===5||day===6||day===0;}
const isEmpty=r=>!['first','second'].some(f=>['not_played','unknown'].includes(attemptState(r,f)))&&(kind(r)==='daily'?r.first===null&&r.second===null:r.blue===null&&r.fragments===null&&r.eggs===null)&&!r.note;
const matchesSource=r=>$('source-filter').value==='all'||kind(r)===$('source-filter').value;
const recordsFor=(date,n)=>[...records.values()].filter(r=>r.date===date&&r.n===n&&matchesSource(r));
const rewardSum=(rs,field)=>{const values=rs.filter(r=>kind(r)==='xiajian'&&r[field]!==null);return values.length?values.reduce((sum,r)=>sum+r[field],0):'—';};
const blueSum=rs=>rs.some(hasBlue)?rs.reduce((sum,r)=>sum+total(r),0):'—';
const selectedNames=()=>view==='calendar'&&location.hash!=='#statistics'?[calendarCharacter]:candidateNames().filter(n=>$('character').value==='all'||String(n)===$('character').value);
const rows=()=>[...records.values()].filter(r=>r.date.startsWith($('month').value)&&selectedNames().includes(r.n)&&matchesSource(r));
function monthDays(){const [year,month]=$('month').value.split('-').map(Number);if(!year||!month)return [];return Array.from({length:new Date(Date.UTC(year,month,0)).getUTCDate()},(_,i)=>`${$('month').value}-${String(i+1).padStart(2,'0')}`);}
function badge(r){if(r&&!isPending(r)&&!isComplete(r))return '<span class="pill">已标记 · '+(hasUnknown(r)?'含未知':'含未打')+'</span>';return !r?'<span class="pill blank">未记录</span>':isComplete(r)?'<span class="pill">完整</span>':`<span class="pill partial">${kind(r)==='xiajian'?'待补产出':'待补一次'}</span>`;}
const cell=v=>v===null?'<span class="muted">—</span>':String(v);
const rarityBands=['0','1–2','3–4','5–6','7–9','≥10'];
function rarityLevel(value){return !Number.isSafeInteger(value)||value<0?null:value===0?0:value<=2?1:value<=4?2:value<=6?3:value<=9?4:5;}
function eligibleLuck(r){return !!r&&kind(r)==='daily'&&rarityLevel(r.first)!==null&&rarityLevel(r.second)!==null&&['recorded',undefined].includes(r.firstState)&&['recorded',undefined].includes(r.secondState);}
function globalDailyAverage(){const all=[...records.values()].filter(eligibleLuck);return all.length?all.reduce((sum,r)=>sum+total(r),0)/all.length:null;}
function dailyLuck(r){if(!eligibleLuck(r))return null;const average=globalDailyAverage();if(average===null||average<=0)return null;const sum=total(r);return sum>average*2?'欧':sum<average/2?'非':'平';}
function luckBadge(){return '';}
function cardRarity(r){if(!r||kind(r)!=='daily')return null;const levels=[rarityLevel(r.first),rarityLevel(r.second)].filter(value=>value!==null);return levels.length?Math.max(...levels):null;}
function applyCardRarity(element,r){
 delete element.dataset.dropRarity;delete element.dataset.attemptGradient;
 element.style.removeProperty('--attempt-left');element.style.removeProperty('--attempt-right');
 delete element.dataset.luckBackground;element.removeAttribute('title');
 if(element.disabled||!r||kind(r)!=='daily')return;
 const colors=['#e9eae6','#e0efdc','#dceafb','#eadcf7','#f9e6b1','#f6d1d0'];
 const [left,right]=[rarityLevel(r.first),rarityLevel(r.second)].sort((a,b)=>(a??-1)-(b??-1));
 if(left!==null||right!==null){element.dataset.attemptGradient='true';element.style.setProperty('--attempt-left',left===null?'#fffdf9':colors[left]);element.style.setProperty('--attempt-right',right===null?'#fffdf9':colors[right]);}
 const luck=dailyLuck(r);if(luck){element.dataset.luckBackground=luck;element.title=`道馆每日蓝票 ${total(r)} 张 · ${luck}（全量道馆日均 ${globalDailyAverage()?.toFixed(2)} 张，>2倍欧、<一半非）`;}
}
function blueChip(value){const level=rarityLevel(value);return level===null?'<span class="rarity-unknown" title="未记录，不计入稀有度">—</span>':`<span class="rarity-chip rarity-${level}" data-rarity="${level}" title="单次 ${value} 张 · ${rarityBands[level]} 档" aria-label="单次 ${value} 张，${rarityBands[level]} 档">${value}</span>`;}
function blueContent(r){return kind(r)==='daily'?`${blueChip(r.first)} + ${blueChip(r.second)}`:blueChip(r.blue);}
function attemptChip(value,index,state){if(value==null&&state&&state!=='pending')return `<span class="attempt rarity-unknown" data-attempt="${index}" title="第${index}次：${state==='not_played'?'未打':'掉落未知，不按零统计'}">${state==='not_played'?'未打':'未知'}</span>`;const label=`第${index===1?'一':'二'}次：${value===null?'未记录':value+' 张蓝票'}`;return `<span class="attempt" data-attempt="${index}" title="${label}" aria-label="${label}">${blueChip(value)}</span>`;}
function rewardAmount(field,value){const fragment=field==='fragments',label=fragment?'黑碎':'黑蛋',unit=fragment?'片':'个';return `<span class="reward-item" data-reward="${field}" title="${label}：${value===null?'未记录':value+' '+unit}" aria-label="${label}：${value===null?'未记录':value+' '+unit}"><span class="reward-art" aria-hidden="true"><img class="reward-icon" src="${fragment?BLUE_ICONS['black-fragment']:BLUE_ICONS['black-egg']}" alt="" width="19" height="19">${fragment?'<span class="fragment-mark">碎</span>':''}</span><span class="reward-value">${value??'—'}</span><span class="reward-unit">${unit}</span></span>`;}
function rewardPair(r){return `<span class="reward-pair">${rewardAmount('fragments',r.fragments)}${rewardAmount('eggs',r.eggs)}</span>`;}
function ticketQuantity(r){return `<span class="ticket-quantity"><span class="ticket-art" aria-hidden="true"><img class="ticket-icon" src="blue-ticket-icon.png" alt="" width="36" height="40"></span><span class="ticket-counts">${kind(r)==='daily'?`${attemptChip(r.first,1,attemptState(r,'first'))}${attemptChip(r.second,2,attemptState(r,'second'))}`:blueChip(r.blue)}</span></span>`;}
function decorateRarity(root=document){
 const query=selector=>[...(root.matches?.(selector)?[root]:[]),...root.querySelectorAll(selector)];
 query('[data-week-date]').forEach(button=>{const r=records.get(keyFor(button.dataset.weekDate,Number(button.dataset.weekRole),button.dataset.weekKind));button.classList.toggle('has-ultra-drop',!!r&&kind(r)==='xiajian'&&r.eggs>0);applyCardRarity(button,r);});
 if(view==='calendar')query('[data-date]').forEach(button=>{const r=records.get(keyFor(button.dataset.date,calendarCharacter,'daily'))??records.get(keyFor(button.dataset.date,calendarCharacter,'xiajian'));button.classList.toggle('has-ultra-drop',!!r&&kind(r)==='xiajian'&&r.eggs>0&&!button.disabled);applyCardRarity(button,r);});
 query('[data-week-date]').forEach(button=>{const r=records.get(keyFor(button.dataset.weekDate,Number(button.dataset.weekRole),button.dataset.weekKind));if(!r)return;button.innerHTML=`<span class="drop-header"><span class="drop-type">${kindLabel(r)}</span><span class="drop-status">${luckBadge(r)}${isPending(r)?'<span class="drop-state">待补</span>':''}</span></span><strong>${ticketQuantity(r)}</strong><span class="drop-footer">${kind(r)==='daily'?`${isComplete(r)?'共':'已知'} ${blueSum([r])} 张`:rewardPair(r)}</span>`;});
 if(view==='calendar')query('[data-date]').forEach(button=>{const r=records.get(keyFor(button.dataset.date,calendarCharacter,'daily'))??records.get(keyFor(button.dataset.date,calendarCharacter,'xiajian')),strong=button.querySelector('.day-total');if(r&&strong){strong.innerHTML=ticketQuantity(r)+(kind(r)==='xiajian'?'<small> 票</small>':'');if(kind(r)==='xiajian'&&strong.nextElementSibling)strong.nextElementSibling.innerHTML=rewardPair(r);}});
 if(view==='entry'&&root===document){const rs=selectedNames().flatMap(n=>{const list=recordsFor(selectedDate,n);return list.length?list:[null];});query('#content tbody tr').forEach((row,i)=>{const r=rs[i];if(r){row.cells[2].innerHTML=ticketQuantity(r);if(kind(r)==='xiajian'){row.cells[4].innerHTML=rewardAmount('fragments',r.fragments);row.cells[5].innerHTML=rewardAmount('eggs',r.eggs);}}});}
 if(view==='detail'&&root===document){const rs=rows().sort((a,b)=>b.date.localeCompare(a.date)||a.n-b.n).slice((page-1)*size,page*size);query('#content tbody tr').forEach((row,i)=>{const r=rs[i];if(r){row.cells[3].innerHTML=ticketQuantity(r);if(kind(r)==='xiajian'){row.cells[5].innerHTML=rewardAmount('fragments',r.fragments);row.cells[6].innerHTML=rewardAmount('eggs',r.eggs);}}});}
 if(view==='calendar')query('[data-date]').forEach(button=>{if(button.disabled)return;const r=records.get(keyFor(button.dataset.date,calendarCharacter,'daily'))??records.get(keyFor(button.dataset.date,calendarCharacter,'xiajian'));if(r)button.querySelector('.kind-label')?.insertAdjacentHTML('beforeend',luckBadge(r));});
}
let statsPage=1,calendarMode='month',periodFrom=localToday().slice(0,7)+'-01',periodTo=localToday();
function validPeriod(){return /^\d{4}-\d{2}-\d{2}$/.test(periodFrom)&&/^\d{4}-\d{2}-\d{2}$/.test(periodTo)&&periodFrom<=periodTo;}
function statsRows(){const range=$('stats-range').value,from=$('stats-from').value,to=$('stats-to').value;const bad=range==='custom'&&(!from||!to||from>to);$('stats-range-error').textContent=bad?'请填写有效的起止日期，结束日期不能早于开始日期。':'';return bad?[]:[...records.values()].filter(r=>selectedNames().includes(r.n)&&matchesSource(r)&&(range==='all'||range==='month'&&r.date.startsWith($('month').value)||range==='custom'&&r.date>=from&&r.date<=to));}
function render(){
 const statistics=location.hash==='#statistics';
 $('rarity-legend').hidden=statistics||view==='trend';
 $('statistics-view').hidden=!statistics;
 const personalCalendar=!statistics&&view==='calendar';
 $('record').disabled=false;if(!personalCalendar||calendarMode!=='period'){$('month').min='';$('month').max='';}
 $('character').closest('label').hidden=personalCalendar;$('source-filter').closest('label').hidden=personalCalendar;
 $('record').textContent=personalCalendar?'录入当前角色':'批量录入';
 $('month').closest('label').hidden=statistics&&$('stats-range').value!=='month';
 $('stats-from-label').hidden=$('stats-to-label').hidden=$('stats-range').value!=='custom';
 $('content').hidden=statistics;$('record').hidden=statistics;
 document.querySelector('.panel h2').textContent=statistics?'蓝票统计':'道馆与狭间，按角色记录';
 document.querySelector('.section-help').textContent=statistics?'支持全部记录累计、所选月和自选日期；按角色或月份汇总，空白不计为零。':'同角色同日二选一：道馆记录两次蓝票；狭间仅周五至周日，记录蓝票、黑碎、黑蛋。0 表示无掉落，空白表示未记录。';
 const list=statistics?statsRows():rows(),complete=list.filter(isComplete),dailyComplete=complete.filter(r=>kind(r)==='daily'),avg=dailyComplete.length?(dailyComplete.reduce((v,r)=>v+total(r),0)/dailyComplete.length).toFixed(1):'—';
 $('scope').textContent=personalCalendar?`${$('month').value} · ${names[calendarCharacter]}的月历`:`${$('month').value} · ${selectedNames().length} 个角色`;
 $('metrics').innerHTML=`<article class="metric"><span>蓝票已录合计（张）</span><strong>${blueSum(list)}</strong><small>含 ${list.filter(isPending).length} 条待补记录的已填数量</small></article><article class="metric"><span>完整记录（条）</span><strong>${complete.length}</strong><small>按角色、日期与来源分别计数</small></article><article class="metric"><span>道馆完整记录日均（张 / 角色）</span><strong>${avg}</strong><small>仅用道馆两次均完整的记录计算</small></article><article class="metric"><span>狭间蓝票（张）</span><strong>${blueSum(list.filter(r=>kind(r)==='xiajian'))}</strong><small>包含在蓝票合计内，不重复累加</small></article><article class="metric"><span>狭间黑碎（片）</span><strong>${rewardSum(list,'fragments')}</strong><small>独立记录，不自动折算黑蛋</small></article><article class="metric"><span>狭间黑蛋（个）</span><strong>${rewardSum(list,'eggs')}</strong><small>直接掉落的黑蛋数量</small></article>`;
 $('source-breakdown').textContent=`当前范围蓝票分项：道馆 ${blueSum(list.filter(r=>kind(r)==='daily'))} 张 · 狭间 ${blueSum(list.filter(r=>kind(r)==='xiajian'))} 张。黑碎、黑蛋不折算成蓝票。`;
 for(const [index,asset] of [[4,'black-fragment'],[5,'black-egg']])$('metrics').children[index].querySelector('span').insertAdjacentHTML('afterbegin',`<img class="metric-label-icon" src="${BLUE_ICONS[asset]}" alt="" width="19" height="19">`);
 if(typeof rewardSum(list,'eggs')==='number'&&rewardSum(list,'eggs')>0)$('metrics').children[5].classList.add('has-ultra-drop');

 $('content').innerHTML=`<div class="heading"><h2>每日已录产出</h2><label class="muted">统计指标 <select id="trend-metric"><option value="blue">蓝票（张）</option><option value="fragments">黑碎（片）</option><option value="eggs">黑蛋（个）</option></select></label></div><p class="trend-note">当前指标：${label}。斜纹为存在待补记录，未填写的指标留空；不同日期记录角色数可能不同，合计不能直接代表掉落效率。</p><div class="chart" role="img" aria-label="${label}每日已录数量，具体数值见下表">${sums.map(d=>`<div class="bar-item" title="${d.date}：${typeof d.sum==='number'?'已录 '+d.sum:'未记录该指标'}">${typeof d.sum==='number'?`<span class="bar-value">${d.sum}</span><div class="bar ${d.rs.some(r=>!isComplete(r))?'partial':''}" style="height:${d.sum/max*78}%"></div>`:''}<span class="bar-label">${Number(d.date.slice(-2))}</span></div>`).join('')}</div><div class="table-wrap"><table><thead><tr><th>日期</th><th class="num">道馆蓝票</th><th class="num">狭间蓝票</th><th class="num">蓝票合计</th><th class="num">黑碎（片）</th><th class="num">黑蛋（个）</th><th class="num">待补记录</th></tr></thead><tbody>${sums.filter(d=>d.rs.length).map(d=>`<tr><td>${d.date}</td><td class="num">${blueSum(d.rs.filter(r=>kind(r)==='daily'))}</td><td class="num">${blueSum(d.rs.filter(r=>kind(r)==='xiajian'))}</td><td class="num">${blueSum(d.rs)}</td><td class="num">${rewardSum(d.rs,'fragments')}</td><td class="num">${rewardSum(d.rs,'eggs')}</td><td class="num">${d.rs.filter(isPending).length}</td></tr>`).join('')||'<tr><td colspan="7" class="empty">本月暂无记录</td></tr>'}</tbody></table></div>`;
 $('trend-metric').value=trendMetric;$('trend-metric').onchange=e=>{trendMetric=e.target.value;renderTrend();};
}
function openEditor(date,ns=selectedNames(),mode=$('source-filter').value==='xiajian'?'xiajian':'daily'){
 selectedDate=date;editingNames=ns;opener=document.activeElement;$('editor-title').textContent=`编辑记录 · ${date}（同日道馆 / 狭间二选一）`;$('error').textContent='';
 $('edit-rows').innerHTML=ns.map(n=>{const r=records.get(`${date}/${n}`);return `<tr><td>${subjectLabel(n)}</td><td>${attemptInput(r,n,'first','第一次')}</td><td>${attemptInput(r,n,'second','第二次')}</td><td><input name="note-${n}" value="${esc(r?.note??'')}" maxlength="500" aria-label="${esc(names[n])}备注"></td></tr>`;}).join('');
 $('xiajian-edit-rows').innerHTML=ns.map(n=>{const r=records.get(keyFor(date,n,'xiajian'));return `<tr><td>${subjectLabel(n)}</td>${[['blue','蓝票'],['fragments','黑碎'],['eggs','黑蛋']].map(([field,label])=>`<td><input name="${field}-${n}" type="number" min="0" step="1" value="${r?.[field]??''}" aria-label="${esc(names[n])}狭间${label}" placeholder="未记录"></td>`).join('')}<td><input name="x-note-${n}" value="${esc(r?.note??'')}" maxlength="500" aria-label="${esc(names[n])}狭间备注"></td></tr>`;}).join('');
 $('editor-kind').querySelector('[value="xiajian"]').disabled=!allowsXiajian(date);
 $('editor-kind').value=mode==='xiajian'&&!allowsXiajian(date)?'daily':mode;setEditorKind();
 $('editor').showModal();document.body.style.overflow='hidden';
}
function setEditorKind(){
 if($('editor-kind').value==='xiajian'&&!allowsXiajian(selectedDate)){$('editor-kind').value='daily';$('error').textContent='狭间仅允许周五、周六、周日录入。';}
 const x=$('editor-kind').value==='xiajian';$('daily-editor').hidden=x;$('xiajian-editor').hidden=!x;for(const id of ['daily-editor','xiajian-editor'])$(id).querySelectorAll('input').forEach(input=>input.disabled=$(id).hidden);
 syncAttemptInputs();const other=x?'daily':'xiajian',conflicts=editingNames.filter(n=>records.has(keyFor(selectedDate,n,other)));
 $('switch-notice').innerHTML=`<p class="muted">${allowsXiajian(selectedDate)?'周五至周日可选择道馆或狭间，同一角色同一天只能保留一种。':'周一至周四仅允许道馆。狭间仅周五至周日开放。'}</p>${conflicts.length?`<label class="preview" style="display:block"><input type="checkbox" id="confirm-replace"> 确认将 ${esc(conflicts.map(n=>names[n]).join('、'))} 的${other==='daily'?'道馆':'狭间'}记录替换为${x?'狭间':'道馆'}，原类型的数量与备注将清除。仅替换本次填入了内容的角色。</label>`:''}`;
}
function subjectLabel(n){return esc(names[n]);}
function closeEditor(){$('editor').close();document.body.style.overflow='';opener?.focus();}
names.forEach((name,n)=>$('character').add(new Option(name,String(n))));
$('rarity-legend').innerHTML=`<span>单次蓝票稀有度</span>${rarityBands.map((label,i)=>`<span class="rarity-chip rarity-${i}">${label}</span>`).join('')}<span>左为第一次，右为第二次；渐变左低右高；数字仍按第一次、第二次排列；道馆按全部完整记录日均：>2倍欧、<一半非，其余平；日均为0或未录完整不判断；狭间不参与欧非。</span>`;

const switchNotice=document.createElement('div');switchNotice.id='switch-notice';document.querySelector('.editor-type').after(switchNotice);
$('editor').querySelector('p.muted').textContent='这里只保存记录，不会保存到数据库。狭间限周五至周日，同角色同日与道馆二选一。切换已有记录需要确认，空白不自动变成 0。';
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{if(b.dataset.view==='statistics'){location.hash='statistics';render();return;}if(b.dataset.view==='calendar'&&$('character').value!=='all')calendarCharacter=Number($('character').value);view=b.dataset.view;location.hash='records';render();});
$('month').onchange=()=>{if(!$('month').value)$('month').value='2026-10';selectedDate=`${$('month').value}-01`;weekStart=monday(selectedDate);page=1;weekPage=1;render();};$('character').onchange=()=>{page=1;weekPage=1;render();};
$('source-filter').onchange=()=>{page=1;render();};$('editor-kind').onchange=setEditorKind;
for(const id of ['stats-range','stats-from','stats-to','stats-group'])$(id).onchange=()=>{statsPage=1;render();};
$('record').onclick=()=>{if(view==='calendar'&&calendarMode==='period'){if(!validPeriod())return;selectedDate=selectedDate<periodFrom?periodFrom:selectedDate>periodTo?periodTo:selectedDate;}const r=view==='calendar'?(records.get(keyFor(selectedDate,calendarCharacter,'daily'))??records.get(keyFor(selectedDate,calendarCharacter,'xiajian'))):null;openEditor(selectedDate,selectedNames(),view==='calendar'?(r?kind(r):'daily'):undefined);};$('close').onclick=closeEditor;$('cancel').onclick=closeEditor;$('editor').oncancel=e=>{e.preventDefault();closeEditor();};
// Initialize after reading the local ledger.
</script>
