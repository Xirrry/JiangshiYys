<body class="workspace-document bounty-document"><main><header class="workspace-header"><div><h1>每日悬赏</h1><p>按角色记录每日悬赏，汇总重点奖励</p></div><div class="toolbar workspace-actions"><button id="refresh-records">刷新</button><select id="window" aria-label="游戏窗口"><option>等待连接</option></select><button id="read">读取所选</button><button class="primary" id="all">读取全部</button></div></header>
<div class="filters workspace-filters"><label class="header-date">查看日期 <input type="date" id="day"></label>
<label>轮次 <select id="filter-round"><option value="morning">早轮 05:00—18:00</option><option value="evening">晚轮 18:00—次日05:00</option></select></label>
<label>角色 <select id="filter-role"><option value="all">全部角色</option></select></label>
<label>类型 <select id="filter-type"><option value="all">全部类型</option><option value="协作">协</option><option value="分享">享</option><option value="普通">普通</option><option value="食材">食材</option><option value="其他">其他</option></select></label>
<label>奖励 <select id="filter-reward"><option value="all">全部奖励</option><option value="jade">勾玉</option><option value="stamina">体力</option><option value="food">食材</option><option value="other">其他奖励</option></select></label>
<label>状态 <select id="filter-state"><option value="all">全部状态</option><option value="unfinished">未完成</option><option value="finished">已完成</option><option value="unclaimed">已完成未领取</option><option value="claimed">已领取</option><option value="unknown">状态未知</option></select></label>
<button id="reset-filters">重置筛选</button>
</div><div class="filter-count" id="filter-count"></div><div class="display-controls"><div class="view-switch workspace-view-switch" role="group" aria-label="悬赏视图"><button data-bounty-view="focus" aria-pressed="true">◇ 重点汇总</button><button data-bounty-view="cards" aria-pressed="false">▦ 卡片总览</button><button data-bounty-view="list" aria-pressed="false">☷ 紧凑列表</button></div><label>任务顺序 <select id="sort"><option value="reward">协/享奖励优先</option><option value="original">记录原顺序</option></select></label><div class="legend"><span style="--color:#ad6264">勾玉</span><span style="--color:#ac873c">体力</span><span style="--color:#718855">食材</span></div></div>
<div class="view-note" id="view-note"></div><details class="page-help"><summary>读取说明</summary><p>普通、协作、分享与食材任务分别记录。重复读取更新同一条任务，历史记录保存在本机。北京时间 05:00 开始早轮，18:00 开始晚轮。按采集时刻归轮，凌晨 05:00 前归前一天晚轮。</p></details>
<div id="status" class="workspace-status" role="status">正在连接读取工具…</div><div id="errors" role="alert"></div><div id="records"></div></main>
<script>
const byId=id=>document.getElementById(id);
let busy=false;
let currentHistory=null,bountyView='focus',otherOpen=false;
try{const saved=localStorage.getItem('bounty-page-view');if(['cards','list','focus'].includes(saved))bountyView=saved}catch{}
try{byId('sort').value=localStorage.getItem('bounty-task-sort')||'reward'}catch{}
function element(tag,text,cls){const node=document.createElement(tag);if(text!==undefined)node.textContent=text;if(cls)node.className=cls;return node}
function setBusy(value){busy=value;document.querySelectorAll('button,input,select').forEach(node=>node.disabled=value)}
function progress(current,target){return (current??'?')+' / '+(target??'?')}
function statusText(task){if(task.claimed===true)return '已领取';if(task.finished===true)return '已完成 · 领取状态待确认';if(task.finished===false)return '未完成';return '完成状态未知'}
function rewardsView(rewards){
 const container=element('div',undefined,'rewards');
 if(!Array.isArray(rewards)||!rewards.length){container.textContent='奖励尚未加载';return container}
 for(const reward of rewards){
  if(!reward||Array.isArray(reward)){container.append(element('span','奖励待更新'));continue}
  const name=reward.name==='Reward'?'未识别奖励':reward.name;
  const item=element('div',undefined,'reward-item');
  const icon=window.bountyRewardIcons?.[name];
  if(icon){
   const image=element('img',undefined,'reward-icon');
   image.src=icon.url;
   image.alt='';
   image.setAttribute('aria-hidden','true');
   item.append(image);
  }
  const detail=element('span',undefined,'reward-detail');
  detail.append(element('strong',reward.count==null?'数量待定':'×'+reward.count),element('small',name));
  item.append(detail);container.append(item);
 }
 return container;
}

function receivedBounty(task){
 if(!['协作','分享'].includes(task.category))return false;
 // Participant 1 initiates the task; participant 2 receives the invitation.
 return (task.participants||[]).some(member=>member.label==='self'&&member.index===2);
}
function rewardPriority(task){
 const special=task.category==='协作'||task.category==='分享';
 if(!special)return {rank:4};
 const rewards=(task.rewards||[]).filter(item=>item&&typeof item==='object'&&!Array.isArray(item));
 const foodNames=new Set(['鲜鱼','排骨','寿司']);
 const definitions=[
  {key:'jade',name:'勾玉',test:r=>Number(r.item_id)===900002},
  {key:'stamina',name:'体力',test:r=>Number(r.item_id)===900003},
  {key:'food',name:'食材',test:r=>foodNames.has(r.name)}
 ];
 for(const [rank,definition] of definitions.entries()){
  const matched=rewards.filter(definition.test);
  if(matched.length){
   const known=matched.every(r=>Number.isFinite(r.count)&&r.count>=0);
   const count=known?matched.reduce((sum,r)=>sum+r.count,0):null;
   return {rank,key:definition.key,name:definition.name,count};
  }
 }
 return {rank:3};
}
function orderedTasks(tasks){
 const entries=tasks.map((task,index)=>({task,index,priority:rewardPriority(task)}));
 if(byId('sort').value==='reward')entries.sort((a,b)=>a.priority.rank-b.priority.rank||a.index-b.index);
 return entries;
}
function currentBountyRound(now=new Date()){
 const hour=new Date(now.getTime()+8*60*60*1000).getUTCHours();
 return hour>=5&&hour<18?'morning':'evening';
}
byId('filter-round').value=currentBountyRound();
const filterIds=['filter-round','filter-role','filter-type','filter-reward','filter-state'];
function matchesFilters(role,task){
 const value=id=>byId(id).value;
 if(value('filter-role')!=='all'&&value('filter-role')!==role.key)return false;
 if(task.round!==value('filter-round'))return false;
 if(value('filter-type')!=='all'&&task.category!==value('filter-type'))return false;
 const reward=rewardPriority({...task,category:'协作'}).key;
 if(value('filter-reward')!=='all'){
  if(value('filter-reward')==='other'?!!reward:reward!==value('filter-reward'))return false;
 }
 const finished=task.finished===true||task.claimed===true;
 switch(value('filter-state')){
  case 'unfinished':return task.finished===false&&task.claimed!==true;
  case 'finished':return finished;
  case 'unclaimed':return task.finished===true&&task.claimed===false;
  case 'claimed':return task.claimed===true;
  case 'unknown':return task.finished==null&&task.claimed!==true;
  default:return true;
 }
}
let launchMatches={},launchingRoles=new Set();
async function syncLaunchMatches(history){try{launchMatches=await window.pywebview.api.launch_matches(history.roles.map(r=>r.key))}catch{launchMatches={}}}
function render(history){
 if(!history.ok)throw Error(history.error);
 currentHistory=history;
 document.body.dataset.view=bountyView;
 document.querySelectorAll('[data-bounty-view]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.bountyView===bountyView)));
 byId('view-note').textContent={cards:'按角色查看完整任务，协与享保留底纹标记。',list:'逐行并列目标、奖励与状态，适合多角色快速检查。',focus:'跨角色按勾玉、体力、食材分组，协作与分享分别展示，隐藏好友发起的任务，其他悬赏默认收起，可按需展开。'}[bountyView];
 const selectedRole=byId('filter-role').value;
 byId('filter-role').replaceChildren(new Option('全部角色','all'),...history.roles.map(role=>new Option(role.name+' · '+role.server,role.key)));
 if(history.roles.some(role=>role.key===selectedRole))byId('filter-role').value=selectedRole;
 const total=history.roles.reduce((sum,role)=>sum+role.tasks.length,0);
 let shown=0,shownRoles=0;
 byId('day').value=history.day;
 const buckets=new Map();
 for(const [reward,title] of [['jade','勾玉'],['stamina','体力'],['food','食材']]){
  for(const [kind,label] of [['coop','协作'],['share','分享']])buckets.set(reward+'-'+kind,{title:title+' · '+label,cards:[]});
 }
 buckets.set('other',{title:'其他悬赏',cards:[]});
 const root=byId('records');root.replaceChildren();byId('filter-count').textContent='';
 if(!history.roles.length){root.append(element('div','当天暂无记录，打开测试角色的悬赏面板后点击读取。','empty'));return}
 for(const role of history.roles){
  const tasks=role.tasks.filter(task=>matchesFilters(role,task)&&(bountyView!=='focus'||!receivedBounty(task)));
  if(!tasks.length)continue;
  shown+=tasks.length;shownRoles++;
  const section=element('section',undefined,'role');
  const visibleCapture=tasks.map(task=>task.captured_at||role.captured_at).sort().at(-1);
  const heading=element('div',undefined,'role-head');heading.append(element('h2',role.name+' · '+role.server),element('small','最近读取 '+visibleCapture.slice(11,19)));section.append(heading);
  const grid=element('div',undefined,'grid');
  for(const {task,priority} of orderedTasks(tasks)){
   const card=element('article',undefined,'task'+(priority.key?' reward-'+priority.key:'')),top=element('div',undefined,'task-top');
   if(task.category==='协作'||task.category==='分享'){
    card.classList.add(task.category==='协作'?'coop-task':'share-task');
    const identity=element('div',undefined,'special-identity');
    card.dataset.typeMark=task.category==='协作'?'协':'享';
    identity.append(element('strong',task.name));
    top.append(identity,element('span',task.category,'tag '+(task.category==='协作'?'coop':'share')));
   }else top.append(element('strong',task.name),element('span',task.category,'tag'));
   card.append(top);
   if(priority.key)card.append(element('div',(task.category==='协作'?'协':'享')+' · '+priority.name+(priority.count===null?'（数量待定）':' ×'+priority.count),'reward-marker'));
   card.append(element('small',(task.round==='morning'?'早轮 05:00':'晚轮 18:00')+' · 采集 '+(task.captured_at||role.captured_at).slice(11,19),'round-tag'));
   const panel=element('div',undefined,'progress');
   function targetLine(label,monster,current,target){
    const row=element('div',undefined,'target-line');
    row.append(element('span',(label?label+' · ':'')+'击败 '+(monster||'目标未记录'),'target-name'),element('span',progress(current,target),'count'));
    panel.append(row);
   }
   if(task.participants?.length){
    for(const member of task.participants){
     const who=member.label==='self'?'自己':member.label==='friend'?'好友':'参与者 '+(member.index??'');
     targetLine(who,member.monster,member.current,member.target);
    }
   }else targetLine('',task.monster||(task.category==='普通'&&task.name!=='神秘妖怪'?task.name:null),task.current,task.target);
   card.append(panel,element('div',statusText(task),'task-status '+(task.finished===true?'done':task.finished===false?'':'unknown')),rewardsView(task.rewards));
   const context=element('div',undefined,'task-context');context.append(element('strong',role.name),element('small',role.server));
   if(bountyView==='focus'&&priority.key&&launchMatches[role.key]){
    const launch=element('button',launchingRoles.has(role.key)?'正在启动…':launchMatches[role.key].label,'quick-launch');
    launch.type='button';launch.disabled=launchingRoles.has(role.key)||launchMatches[role.key].label==='正在启动…';
    launch.title='打开角色管理中匹配的游戏角色';launch.setAttribute('aria-label',role.name+' · '+launch.textContent);
    launch.onclick=async()=>{if(launchingRoles.has(role.key))return;launchingRoles.add(role.key);render(currentHistory);try{await window.pywebview.api.launch_role(role.key);await syncLaunchMatches(currentHistory)}catch(e){byId('errors').textContent=e.message}finally{launchingRoles.delete(role.key);render(currentHistory)}};
    context.append(launch);
   }
   card.append(context);
   if(bountyView==='focus')buckets.get(priority.key?priority.key+'-'+(task.category==='分享'?'share':'coop'):'other').cards.push(card);else grid.append(card);
  }
  if(bountyView!=='focus'){section.append(grid);root.append(section);}
 }
 const lanes=new Map();
 if(bountyView==='focus')for(const [reward,label] of [['jade','勾玉'],['stamina','体力'],['food','食材']]){
  const count=['coop','share'].reduce((n,kind)=>n+buckets.get(reward+'-'+kind).cards.length,0);
  if(!count)continue;
  const lane=element('div',undefined,'reward-lane');lane.dataset.reward=reward;
  const title=element('div',undefined,'lane-title');title.append(element('h2',label),element('small',count+' 条任务'));
  lane.append(title);root.append(lane);lanes.set(reward,lane);
 }
 if(bountyView==='focus')for(const [key,bucket] of buckets){
  if(!bucket.cards.length)continue;
  const other=key==='other',section=element(other?'details':'section',undefined,'focus-section');section.dataset.group=key;
  const heading=element(other?'summary':'div',undefined,'role-head');
  heading.append(element('h2',other?bucket.title:key.endsWith('-share')?'分享':'协作'),element('small',bucket.cards.length+' 条任务'+(other?' · 点击展开':'')));
  if(other){section.open=otherOpen;section.addEventListener('toggle',()=>{if(section.isConnected)otherOpen=section.open})}
  const grid=element('div',undefined,'grid');grid.append(...bucket.cards);section.append(heading,grid);(other?root:lanes.get(key.split('-')[0])).append(section);
 }
 byId('filter-count').textContent='匹配 '+shown+' / '+total+' 条任务 · '+shownRoles+' 个角色';
 if(!shown)root.append(element('div','没有符合条件的任务，可调整或重置筛选。','empty'));
}
async function history(){try{const data=await window.pywebview.api.history(byId('day').value||null);await syncLaunchMatches(data);render(data)}catch(e){byId('errors').textContent=e.message}}
async function refresh(){if(busy)return;setBusy(true);try{const r=await window.pywebview.api.windows();if(!r.ok)throw Error(r.error);const previous=byId('window').value;byId('window').replaceChildren(...r.windows.map(w=>new Option(w.title,w.id)));if(!r.windows.length)byId('window').append(new Option('未检测到游戏窗口',''));if(r.windows.some(w=>w.id===previous))byId('window').value=previous;byId('status').textContent=r.windows.length+' 个运行窗口'}catch(e){byId('errors').textContent=e.message}finally{setBusy(false)}}
async function read(target){if(busy)return;if(!target){byId('errors').textContent='请先选择运行窗口';return}setBusy(true);byId('errors').textContent='';byId('status').textContent='正在按窗口依次读取，游戏可能短暂停顿…';try{const r=await window.pywebview.api.read(target);if(!r.ok)throw Error(r.error);await syncLaunchMatches(r.history);render(r.history);const ok=r.results.filter(x=>x.ok),failed=r.results.filter(x=>!x.ok);byId('status').textContent='读取完成，成功 '+ok.length+' 个窗口，失败 '+failed.length+' 个窗口';byId('errors').textContent=failed.map(x=>x.title+'：'+x.error).join('\n')}catch(e){byId('errors').textContent=e.message;byId('status').textContent='读取未完成'}finally{setBusy(false)}}
byId('read').addEventListener('click',()=>read(byId('window').value));byId('all').addEventListener('click',()=>read('all'));byId('day').addEventListener('change',history);
byId('refresh-records').onclick=async()=>{if(busy)return;await refresh();await history()};
byId('sort').addEventListener('change',()=>{try{localStorage.setItem('bounty-task-sort',byId('sort').value)}catch{}if(currentHistory)render(currentHistory)});
filterIds.forEach(id=>byId(id).addEventListener('change',()=>{if(currentHistory)render(currentHistory)}));
byId('reset-filters').addEventListener('click',()=>{filterIds.forEach(id=>byId(id).value=id==='filter-round'?currentBountyRound():'all');if(currentHistory)render(currentHistory)});
document.querySelectorAll('[data-bounty-view]').forEach(button=>button.onclick=()=>{bountyView=button.dataset.bountyView;try{localStorage.setItem('bounty-page-view',bountyView)}catch{}if(currentHistory)render(currentHistory)});
async function init(){await refresh();await history()}
if(window.pywebview?.api)init();else window.addEventListener('pywebviewready',init,{once:true});
</script></html>
